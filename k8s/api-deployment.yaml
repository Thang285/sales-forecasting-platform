# PVC for Shared Model Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read/write
  resources:
    requests:
      storage: 1Gi  # Request for 1 GiB of storage
---
# Master API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecasting-api-deployment
  namespace: default
  labels:
    app: forecasting-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forecasting-api
  template:
    metadata:
      labels:
        app: forecasting-api
    spec:
      containers:
      - name: forecasting-api
        image: vietthang123tt/will:fastapi-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: your-app-db.default.svc.cluster.local
        - name: DB_NAME
          value: your_database_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do
              key: password
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 1
        volumeMounts:
          - name: model-storage
            mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
---
# Service for API
apiVersion: v1
kind: Service
metadata:
  name: forecasting-api-service
  namespace: default
spec:
  selector:
    app: forecasting-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 32001
  type: NodePort
---
# Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecasting-worker-deployment
  namespace: default
  labels:
    app: forecasting-worker
spec:
  replicas: 2  # Two worker pods
  selector:
    matchLabels:
      app: forecasting-worker
  template:
    metadata:
      labels:
        app: forecasting-worker
    spec:
      containers:
      - name: forecasting-worker
        image: vietthang123tt/will-worker:latest
        imagePullPolicy: Always
        command: ["python", "worker.py"]  # Adjust if needed
        env:
        - name: DB_HOST
          value: your-app-db.default.svc.cluster.local
        - name: DB_NAME
          value: your_database_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do
              key: password
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          exec:
            command: ["pgrep", "python"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["pgrep", "python"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 1
        volumeMounts:
          - name: model-storage
            mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
