# k8s/data-ingestion-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: data-ingestion
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: data-ingestion
        image: vietthang123tt/will:data-ingestion-v1  # Use the image you built
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: your-app-db.default.svc.cluster.local # Internal K8s service name
        - name: DB_NAME
          value: your_database_name # Matches your PG cluster config
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do
              key: username # Matches your PG cluster config
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: your-app-user.your-app-db.credentials.postgresql.acid.zalan.do # Use the name of the secret you created
              key: password # Key within the secret
        resources: # Adjust resources based on your script's needs
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
      restartPolicy: OnFailure # If the script fails, retry
  backoffLimit: 3 # Max number of retries